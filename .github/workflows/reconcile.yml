name: Rapprochement des paiements

# VÉRIFICATEUR IRRÉGULIER depuis 0170 : la cadence de cinq minutes repose sur
# pg_cron dans Supabase. Mesuré le 2026-11-07 : Actions n'a lancé ce workflow
# que 3 à 8 fois par jour au lieu de 288. Chaque passage qui a lieu rejoue la
# même route et ÉCHOUE si la réponse n'est pas saine, ce que pg_net ne vérifie
# pas. pg_cron, ce workflow et le cron quotidien Vercel invoquent le même
# worker et son bail DB, sans seconde logique d'argent. Voir docs/04 §3.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: reconcile-production
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && vars.ZABELIE_RECONCILE_SCHEDULER == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Déclencher le rapprochement canonique et vérifier son résultat
        env:
          ZABELIE_URL: ${{ vars.ZABELIE_URL }}
          ZABELIE_RECONCILE_SCHEDULER: ${{ vars.ZABELIE_RECONCILE_SCHEDULER }}
          RECONCILE_SECRET: ${{ secrets.RECONCILE_SECRET }}
        run: node scripts/declencher-reconciliation.mjs
