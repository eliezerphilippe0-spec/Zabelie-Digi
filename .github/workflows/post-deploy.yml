name: Vérification après déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: post-deploy
  cancel-in-progress: true

jobs:
  readyz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la livraison attendue et le chemin acheteur
        env:
          ZABELIE_URL: ${{ vars.ZABELIE_URL }}
          ZABELIE_EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verifier-deploiement.mjs
