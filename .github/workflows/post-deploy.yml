name: Vérification après déploiement

on:
  push:
    branches: [main]
  # Chaque jour (6 h 17 à Port-au-Prince) : une protection peut tomber sans
  # déploiement (configuration Vercel, en-tête, domaine). docs/78.
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: post-deploy-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  readyz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Vérifier la livraison attendue et le chemin acheteur
        env:
          ZABELIE_URL: ${{ vars.ZABELIE_URL }}
          ZABELIE_EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verifier-deploiement.mjs
      - name: Vérifier les protections publiques effectives
        env:
          ZABELIE_URL: ${{ vars.ZABELIE_URL }}
        run: node scripts/verifier-securite-publique.mjs
