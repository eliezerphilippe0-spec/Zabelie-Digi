name: Zabelie - Supervision Jev

on:
  workflow_dispatch:
  # EN VEILLE depuis le 2026-09-25, sur demande du porteur (« mets la
  # supervision Jev en veille ») : sans clé TypeSafe ni variable
  # JEV_SUPERVISION_ENABLED, chaque passage planifié échouait (« inactive »),
  # quatre fois par jour. Le lancement MANUEL reste possible, et échoue
  # toujours bruyamment tant que rien n'est configuré.
  # Pour réactiver : poser la clé et la variable, puis rétablir ces lignes —
  #   schedule:
  #     - cron: "17 * * * *"

# No repository writes, PR creation, deployments or database credentials.
permissions:
  contents: read
  actions: read

concurrency:
  group: zabelie-jev-supervision
  cancel-in-progress: false

jobs:
  supervise:
    # L'activation n'est PAS une garde de job : un `skipped` est indiscernable
    # d'un vert. Elle est lue par le script, qui rapporte « inactive » et sort
    # en échec. Sans elle, aucune sonde n'est tirée et rien n'est facturé.
    if: github.repository == 'eliezerphilippe0-spec/Zabelie-Digi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node built-ins only: no npm install or third-party lifecycle scripts with secrets.
      - name: Vérifier et proposer la maintenance
        env:
          JEV_SUPERVISION_ENABLED: ${{ vars.JEV_SUPERVISION_ENABLED }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/jev-supervisor.mjs --output-dir "$RUNNER_TEMP/jev-report"
      - name: Conserver le rapport même en cas d’alerte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-supervision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jev-report/
          if-no-files-found: error
          retention-days: 14
