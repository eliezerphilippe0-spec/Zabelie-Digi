name: CI

# Chaque commit d'une branche portant une PR ouverte satisfaisait LES DEUX
# déclencheurs : `push` puis `pull_request`/`synchronize`. Deux exécutions
# complètes du même SHA, `e2e` compris. Sur 388 runs, la moitié était du
# doublon — et un échec réel se cherchait au milieu.
#
# `synchronize` est donc retiré : le push couvre chaque commit, la PR couvre
# son ouverture. AUCUNE couverture n'est perdue, y compris pour la protection
# de branche à venir : un check est attaché au SHA, pas à l'événement qui l'a
# produit. Constaté pendant cette session, pas supposé — l'API des check runs
# de la PR #55 rendait bien les runs déclenchés par `push`.
on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, reopened, ready_for_review]

# Moindre privilège pour le jeton du workflow. Sans ce bloc, ses droits
# dépendent d'un réglage du dépôt, invisible depuis ce fichier. Lecture du
# code, et lecture des PR pour que gitleaks liste les commits d'une PR. Aucune
# étape n'écrit : pas de commentaire, pas de statut posé à la main.
permissions:
  contents: read
  pull-requests: read

# Quand plusieurs commits s'enchaînent, le run devenu obsolète est annulé au
# lieu d'occuper la file jusqu'au bout. Le SHA de tête — le seul que la
# protection de branche regarde — est toujours celui qui va au bout.
#
# CE QUE ÇA LAISSE DERRIÈRE, et qu'il faut savoir avant de s'y fier : un commit
# INTERMÉDIAIRE d'une PR active garde un état partiel — les jobs courts ont eu
# le temps de finir, les longs sont annulés. « Annulé » n'est pas « échoué »,
# mais ce n'est pas « vert » non plus. Lors d'une bissection ou d'un retour
# arrière, ne pas lire le statut CI d'un commit intermédiaire comme une
# validation : relancer le workflow sur ce SHA. Le compromis est voulu — seule
# la tête compte à la fusion — mais une absence de vérification qui ressemble à
# une vérification est exactement le motif qu'on traque ailleurs dans ce dépôt.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `tests/secrets-hors-depot.test.ts` lit l'ARBRE COURANT : une clé
      # commitée puis retirée dans le même push y échappe, et il ne connaît
      # que les familles qu'on lui a listées. gitleaks lit les COMMITS poussés,
      # avec ses quelque deux cents règles. Étape du job `build` et pas job à
      # part : le nom d'un job est un contrat avec la protection de branche
      # (`tests/ci-jobs-discipline.test.ts`), et un job de plus coûterait une
      # minute facturée par run, arrondi oblige. Version épinglée : une règle
      # qui change seule ferait rougir un run sans changement de code.
      # Faux positifs connus et nommés : `.gitleaks.toml`.
      - name: Secrets dans les commits poussés (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      # Audit du 2026-09-02, constat #7 : `next lint` était mort sous Next 16
      # et aucun job ne lintait. Bloquant, comme le contraste — un contrôle qui
      # ne bloque rien est un vœu.
      - name: Lint
        run: npm run lint

      # Bloquant depuis la revue 2026-08-10 (UI-04) : l'ancien QC mesurait la
      # palette abandonnée, sortait en 0 et n'était appelé nulle part — un
      # contrôle qui ne bloque rien est un vœu. Sortie ≠ 0 = paire sous le
      # seuil WCAG ou opacité de texte < /80 dans app/ ou components/.
      - name: Contraste (WCAG AA)
        run: npm run check:contrast

      - name: Tests
        run: npm test

      - name: Install ClamAV engine
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clamav

      - name: Verify real engine with a synthetic signature
        run: node --import tsx --test tests/clamav.integration.ts

      - name: Verify private scanner service on Linux
        run: bash scripts/test-scanner-service.sh

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Une branche qui ne touche QUE `docs/` ou des `.md` ne peut rien changer
      # à un parcours navigateur : l'application n'en lit aucun à l'exécution.
      # Mesuré sur 30 jours : 64 runs sur 355, à ~8 min d'e2e chacun. La mesure
      # porte sur la BRANCHE ENTIÈRE (merge-base avec main), jamais sur le
      # dernier commit — détail et preuves dans `scripts/ci-portee.mjs` et
      # `tests/ci-portee.test.ts`. Le saut s'affiche en annotation et dans le
      # résumé du job : un vert sans e2e doit se voir. Toute incertitude lance
      # l'e2e — d'où `!= 'true'`, jamais `== 'false'`, sur chaque étape.
      - name: Portée du changement
        id: portee
        run: node scripts/ci-portee.mjs

      - uses: actions/setup-node@v4
        if: steps.portee.outputs.docs_seulement != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.portee.outputs.docs_seulement != 'true'
        run: npm ci

      # `--with-deps` retiré après mesure, pas par principe. Sur le run
      # bed4fe0, il n'a installé QUE des polices — « 0 upgraded, 9 newly
      # installed », les neuf étant fonts-ipafont-gothic, fonts-freefont-ttf,
      # fonts-unifont, fonts-wqy-zenhei, xfonts-cyrillic… Toutes les vraies
      # bibliothèques du navigateur (libnss3, libgbm1, libdrm2, libatk,
      # libxkbcommon0…) étaient déjà là : le journal répète `already the
      # newest version` pour chacune. L'image ubuntu-24.04 les embarque.
      #
      # Ces polices couvrent le japonais, le thaï, le chinois et le
      # cyrillique. La suite e2e lit du texte latin et vérifie des
      # redirections — vérifié : aucun `toHaveScreenshot`, aucun
      # `toMatchSnapshot`, aucune comparaison visuelle dans `e2e/`.
      #
      # Ce que ça coûtait : 21,1 Mo tirés à 59 ko/s depuis le miroir Azure,
      # soit 5 min 58 s — 358 des 425 secondes du job. Tout le reste était
      # sain (npm ci 10 s, Chromium 177 Mo en 5 s depuis le CDN Playwright,
      # next build 17 s, tests 8,2 s).
      #
      # Mode d'échec si une image d'exécuteur cessait un jour d'embarquer une
      # bibliothèque : Chromium refuse de démarrer avec un message qui la
      # NOMME. Bruyant et immédiat — l'inverse des défauts silencieux qu'on
      # traque ailleurs dans ce dépôt. On remettrait `--with-deps` ce jour-là.
      - name: Playwright browsers
        if: steps.portee.outputs.docs_seulement != 'true'
        run: npx playwright install chromium

      - name: Build
        if: steps.portee.outputs.docs_seulement != 'true'
        run: npm run build

      - name: E2E (money path)
        if: steps.portee.outputs.docs_seulement != 'true'
        run: npm run test:e2e

      - name: Seller pricing and launch in the browser
        if: steps.portee.outputs.docs_seulement != 'true'
        run: npx playwright test --config=playwright.pricing.config.ts

      - name: Boutique and digital purchase journey
        if: steps.portee.outputs.docs_seulement != 'true'
        run: npx playwright test --config=playwright.boutique.config.ts

      - name: Variant discounts and purchase price
        if: steps.portee.outputs.docs_seulement != 'true'
        run: npx playwright test --config=playwright.rabais.config.ts

      - name: Seller offers and explicit purchase choice
        if: steps.portee.outputs.docs_seulement != 'true'
        run: npx playwright test --config=playwright.offers.config.ts

      - name: Haiti operations and support on mobile
        if: steps.portee.outputs.docs_seulement != 'true'
        run: npx playwright test --config=playwright.operations.config.ts

      - name: Sandbox top-ups cannot accept payment
        if: steps.portee.outputs.docs_seulement != 'true'
        run: npx playwright test --config=playwright.topup.config.ts

      # Même check requis e2e, nouveau build isolé : les variables publiques
      # doivent être présentes à la compilation du client navigateur.
      - name: Build avec le client Auth configuré
        if: steps.portee.outputs.docs_seulement != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:15423
          NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-anon-de-test
          SUPABASE_SERVICE_ROLE_KEY: cle-service-de-test
        run: npm run build
      - name: Connexion et inscription dans le navigateur
        if: steps.portee.outputs.docs_seulement != 'true'
        run: npx playwright test --config=playwright.auth.config.ts

  sql-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: SQL money-path tests (migrations + assertions)
        run: bash supabase/tests/run.sh


      - name: Restore synthetic orders and support in an isolated database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash supabase/tests/recovery-ci.sh
